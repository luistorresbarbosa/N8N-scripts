---
- name: Bootstrap Docker and Dockge
  hosts: ai_sandbox
  become: true
  tasks:
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts.os_family == "Debian"

    - name: Install dnf plugin utilities (RedHat)
      ansible.builtin.package:
        name: dnf-plugins-core
        state: present
      when: ansible_facts.os_family == "RedHat"

    - name: Add Docker CE repository (RedHat)
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable - $basearch
        baseurl: "https://download.docker.com/linux/centos/$releasever/$basearch/stable"
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/centos/gpg
        enabled: true
      when: ansible_facts.os_family == "RedHat"

    - name: Update dnf cache (RedHat)
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts.os_family == "RedHat"

    - name: Resolve Docker package list
      ansible.builtin.set_fact:
        docker_packages_resolved: >-
          {{ docker_packages_map[ansible_facts.os_family]
             | default(docker_packages_map['Debian']) }}

    - name: Install Docker packages
      ansible.builtin.package:
        name: "{{ docker_packages_resolved }}"
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create Dockge directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dockge_install_dir }}"
        - "{{ dockge_data_dir }}"
        - "{{ dockge_stacks_dir }}"

    - name: Render Dockge compose file
      ansible.builtin.template:
        src: dockge/docker-compose.yml.j2
        dest: "{{ dockge_install_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Start Dockge
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ dockge_install_dir }}"
      register: dockge_up
      changed_when: >
        "Creating" in dockge_up.stdout
        or "Recreating" in dockge_up.stdout
        or "Started" in dockge_up.stdout
