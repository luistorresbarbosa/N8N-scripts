---
- name: Bootstrap Docker and Dockge
  hosts: ai_sandbox
  become: true
  tasks:
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts.os_family == "Debian"

    - name: Install Docker packages
      ansible.builtin.package:
        name: "{{ docker_packages }}"
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create Dockge directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dockge_install_dir }}"
        - "{{ dockge_data_dir }}"
        - "{{ dockge_stacks_dir }}"

    - name: Render Dockge compose file
      ansible.builtin.template:
        src: dockge/docker-compose.yml.j2
        dest: "{{ dockge_install_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Start Dockge
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ dockge_install_dir }}"
      register: dockge_up
      changed_when: >
        "Creating" in dockge_up.stdout
        or "Recreating" in dockge_up.stdout
        or "Started" in dockge_up.stdout
